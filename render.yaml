services:
  - type: web
    name: agruni-pay
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agruni-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MOMO_MODE
        value: sandbox
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MOMO_CURRENCY
        value: EUR
      - key: MOMO_TARGET_ENV
        value: sandbox
      - key: SMS_MODE
        value: pindo
      - key: PINDO_API_TOKEN
        sync: false
      - key: PINDO_SENDER
        value: PindoTest
databases:
  - name: agruni-db
    plan: basic-256mb
